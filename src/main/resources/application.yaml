spring:
  jpa:
    show-sql: true
    properties:
      hibernate:
        format_sql: true
        use_sql_comments: true

logging:
  level:
    org:
      hibernate:
        SQL: DEBUG
        type:
          descriptor:
            sql:
              BasicBinder: TRACE
        orm:
          jdbc:
            bind: TRACE

rsa:
  private-key: classpath:certs/private.pem
  public-key: classpath:certs/public.pem

liquibase:
  enabled: true
  change-log: classpath:db/changelog/db.changelog-master.yaml